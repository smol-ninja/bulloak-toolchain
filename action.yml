name: "bulloak-toolchain"
description: "Install Bulloak and check that Solidity tests conform to BTT spec"
author: "Shubham Yadav"

branding:
  icon: "feather"
  color: "green"

inputs:
  cache:
    default: "true"
    description: "Whether to cache Cargo build"
    required: false
  skip-modifiers:
    default: "false"
    description: "Whether to ignore modifiers declaration in the Solidity test contracts"
    required: false
  test-dir:
    description: "The test directory"
    required: true
  version:
    default: "latest"
    description: "The version of Bulloak to install"
    required: false

outputs:
  bulloak-version:
    description: "Version as reported by `bulloak --version`"
    value: ${{steps.version.outputs.bulloak-version}}

runs:
  using: "composite"
  steps:
    - name: "Validate inputs"
      shell: bash
      env:
        TEST_DIR: ${{ inputs.test-dir }}
        VERSION: ${{ inputs.version }}
      run: |
        if [ -z "$TEST_DIR" ]; then
          echo "::error::Required input 'test-dir' is missing"
          exit 1
        fi

    - id: resolve-version
      name: "Resolve version"
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [ "$VERSION" == "latest" ]; then
          RESOLVED=$(curl -s https://crates.io/api/v1/crates/bulloak | jq -r '.crate.max_version')
          echo "version=$RESOLVED" >> $GITHUB_OUTPUT
        else
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        fi

    - name: "Install Rust"
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        cache: false # Caching separately in the next step
        toolchain: stable

    - id: cache-cargo
      name: "Cache bulloak binary"
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@v4
      with:
        key: ${{ runner.os }}-bulloak-${{ steps.resolve-version.outputs.version }}
        path: ~/.cargo/bin/bulloak

    - name: "Install cargo-binstall"
      if: steps.cache-cargo.outputs.cache-hit != 'true'
      uses: cargo-bins/cargo-binstall@main

    - name: "Install bulloak"
      if: steps.cache-cargo.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.resolve-version.outputs.version }}
        DOCS_RS: "1"
      run: |
        cargo binstall bulloak --version "$VERSION" --no-confirm --log-level info

    - id: "version"
      name: "Print installed version"
      shell: bash
      run: |
        echo "bulloak-version=$(bulloak --version)" >> $GITHUB_OUTPUT
        bulloak --version

    - name: "Check that the Solidity tests conform to BTT spec"
      env:
        SKIP_MODIFIERS: ${{ inputs.skip-modifiers }}
        TEST_DIR: ${{ inputs.test-dir }}
      shell: bash
      run: |
        echo "🌳 Checking the Solidity tests using Bulloak"
        if [ "$SKIP_MODIFIERS" == "true" ]; then
          find $TEST_DIR -name "*.tree" -print0 | xargs -0 -I {} sh -c 'bulloak check "{}" --skip-modifiers'
        else
          find $TEST_DIR -name "*.tree" -print0 | xargs -0 -I {} sh -c 'bulloak check "{}"'
        fi
